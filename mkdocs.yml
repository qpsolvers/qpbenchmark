site_name: qpbenchmark
site_description: Benchmark for quadratic programming solvers available in Python
site_url: https://qpsolvers.github.io/qpbenchmark/
repo_name: qpsolvers/qpbenchmark
repo_url: https://github.com/qpsolvers/qpbenchmark
edit_uri: ""

# The main page and test-set pages are generated by docs/hooks.py from
# README.md and reports in test_sets/<test_set>/results/
docs_dir: docs/src
site_dir: docs/html
hooks:
    - docs/hooks.py

theme:
    name: material
    features:
        - content.code.copy
        - navigation.indexes
        - navigation.top
        - search.highlight
        - toc.follow
    icon:
        repo: fontawesome/brands/github
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to light mode

markdown_extensions:
    - admonition
    - attr_list
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.highlight
    - pymdownx.superfences
    - tables
    - toc:
          permalink: true

extra_javascript:
    - javascripts/mathjax.js
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
    links:
        anchors: warn
