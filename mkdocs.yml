site_name: qpbenchmark
site_description: Benchmark for quadratic programming solvers available in Python
site_url: https://qpsolvers.github.io/qpbenchmark/
repo_name: qpsolvers/qpbenchmark
repo_url: https://github.com/qpsolvers/qpbenchmark
edit_uri: ""

# The main page and test-set pages are generated by docs/hooks.py from
# README.md and reports in test_sets/<test_set>/results/
docs_dir: docs/src
site_dir: docs/html
hooks:
    - docs/hooks.py

theme:
    name: material
    features:
        - content.code.copy
        - navigation.indexes
        - navigation.sections
        - navigation.top
        - search.highlight
        - toc.follow
    icon:
        repo: fontawesome/brands/github
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to light mode

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  paths: [.]
                  options:
                      docstring_style: google
                      filters:
                          - "!^_[^_]"  # private members
                          - "!^__.*(?<!__)$"  # name-mangled members, not dunders
                      heading_level: 3
                      members_order: source
                      merge_init_into_class: true
                      separate_signature: true
                      show_root_full_path: false
                      show_root_heading: true
                      show_signature_annotations: true
                      show_source: false
                      show_symbol_type_heading: true

markdown_extensions:
    - admonition
    - attr_list
    - pymdownx.highlight
    - pymdownx.superfences
    - tables
    - toc:
          permalink: true

validation:
    links:
        anchors: warn
