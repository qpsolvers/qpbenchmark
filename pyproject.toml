[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "qpbenchmark"
readme = "README.md"
authors = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
maintainers = [
    {name = "Stéphane Caron", email = "stephane.caron@normalesup.org"},
]
dynamic = ['version', 'description']
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib >=3.6.2",
    "numpy >=1.25.2",
    "pandas >=1.4.3",
    "py-cpuinfo >=9.0.0",
    "pyarrow >=15.0.0",
    "qpsolvers >=4.3.1",
    "tabulate >=0.9.0",
    "tqdm >=4.67.1",
]
keywords = ["quadratic programming", "benchmark", "solvers", "numerical optimization"]

[project.scripts]
qpbenchmark = "qpbenchmark.benchmark:main"

[project.urls]
Homepage = "https://github.com/qpsolvers/qpbenchmark"
Source = "https://github.com/qpsolvers/qpbenchmark"
Tracker = "https://github.com/qpsolvers/qpbenchmark/issues"
Changelog = "https://github.com/qpsolvers/qpbenchmark/blob/main/CHANGELOG.md"

[tool.flit.sdist]
exclude = [
    ".git*",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "pixi.lock",
    "tests/",
    "uv.lock",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = [
    "D401",  # good for methods but not for class docstrings
    "D405",  # British-style section names are also "proper"!
    "E741",  # we have a variable called 'l'
]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pydocstyle
    "D"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true
warn_no_return = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
matplotlib-base = ">=3.6.2"
numpy = ">=1.25.2"
pandas = ">=1.4.3"
py-cpuinfo = ">=9.0.0"
pyarrow = ">=15.0.0"
qpsolvers = ">=4.3.1"
tabulate = ">=0.9.0"
tqdm = ">=4.67.1"

[tool.pixi.pypi-dependencies]
qpbenchmark = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
coverage = ">=5.5"
daqp = ">=0.5.1"

[tool.pixi.feature.test.tasks]
test = { cmd = "python -m unittest discover", description = "Run unit tests" }
coverage = { cmd = "coverage erase && coverage run -m unittest discover && coverage report --include='qpbenchmark/**'", description = "Run unit tests and report code coverage" }

[tool.pixi.feature.coveralls.dependencies]
coveralls = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
pymdown-extensions = ">=10.0"

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "mkdocs build --strict", description = "Build the website from the readme and test-set reports" }
docs-serve = { cmd = "mkdocs serve", description = "Serve the website locally with live reload" }

[tool.pixi.feature.lint.dependencies]
mypy = ">=0.812"
ruff = ">=0.5.4"

[tool.pixi.feature.lint.tasks]
format = { cmd = "ruff format qpbenchmark && ruff check --select I --fix qpbenchmark", description = "Format source code" }
format-check = { cmd = "ruff format --check --diff qpbenchmark", description = "Check source code formatting" }
ruff = { cmd = "ruff check qpbenchmark", description = "Lint source code with ruff" }
mypy = { cmd = "mypy qpbenchmark", description = "Type-check source code" }
lint = { depends-on = ["format-check", "ruff", "mypy"], description = "Run all linters" }

[tool.pixi.feature.solvers]
channels = ["conda-forge", "gurobi"]

[tool.pixi.feature.solvers.tasks]
qpbenchmark = { cmd = "qpbenchmark", description = "Run the qpbenchmark CLI with all benchmarked solvers" }

[tool.pixi.feature.solvers.dependencies]
clarabel = ">=0.4.1"
cvxopt = ">=1.3.0"
daqp = ">=0.5.1"
ecos = ">=2.0.10"
gurobi = ">=11.0.3"
ipython = "*"
kvxopt = "*"
osqp = ">=0.6.2"
piqp = ">=0.2.2"
proxsuite = ">=0.4.1"
qpoases = ">=3.2.0"
quadprog = ">=0.1.11"
scs = ">=3.2.2"

[tool.pixi.feature.solvers.target.unix.dependencies]
jaxopt = "*"  # no jaxlib for win-64 on conda-forge

[tool.pixi.feature.solvers.pypi-dependencies]
highspy = ">=1.5.2"
qpalm = ">=1.2.1"
qpax = "*"
sip_qp_python = ">=0.0.2"

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["test", "lint"], solve-group = "default" }
coverage = { features = ["test", "coveralls"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }
solvers = { features = ["solvers"] }
py39 = ["py39", "test"]
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
